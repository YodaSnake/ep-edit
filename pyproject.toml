[project]
name = "ep-edit"
version = "0.1.0"
description = "Deterministic, review-first exact text editing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "text-editing", "deterministic", "developer-tools", "coding-agents"]
dependencies = []

[project.urls]
Repository = "https://github.com/YodaSnake/ep-edit"
Issues = "https://github.com/YodaSnake/ep-edit/issues"

[project.scripts]
ep-edit = "ep_edit.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "unit: isolated unit tests",
]
